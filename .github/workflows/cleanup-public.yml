name: One-shot public cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Clean public copy and docs
        shell: python
        run: |
          from pathlib import Path
          import re

          replacements={
            "index.html":[
              ("Los datos prácticos de la escala que estamos preparando.","Datos prácticos de la Escala Administrativa."),
              ("La app publicada actualmente es exclusivamente de Administrativo/a. La página de Subalterno se mantiene como información útil sobre esa escala, no como promesa de producto.",
               "La app disponible actualmente está dedicada a Administrativo/a. Para Subalterno, la web ofrece información sobre la convocatoria y la batería oficial.")
            ],
            "bateria-500-preguntas-administrativo-ehu/index.html":[
              ("Esta guía se centra en <strong>cómo preparar</strong> la batería. El análisis cuantitativo y de fiabilidad vive ahora en páginas independientes para no mezclar intenciones: allí puedes consultar los recuentos de contenido EHU, referencias normativas, respuestas revisadas y reutilización histórica.",
               "Esta guía se centra en <strong>cómo preparar</strong> la batería. Para ampliar el análisis, puedes consultar por separado la radiografía de las 500 preguntas, el reparto por temas, las respuestas revisadas y la recurrencia histórica.")
            ],
            "subalterno/bateria-400-preguntas/index.html":[
              ("En esta página no publicamos todavía un reparto pregunta → tema porque no hemos cerrado un análisis propio equivalente al realizado para Administrativo. Preferimos no presentar como dato una clasificación que aún no ha sido auditada.",
               "La guía se centra en la batería oficial y en el formato del ejercicio. Actualmente no incluye una distribución pregunta → tema."),
              ("la aplicación publicada por Euskadi Oposiciones corresponde exclusivamente a Administrativo. No presentamos esa app como producto de Subalterno.",
               "la aplicación disponible actualmente está dedicada a Administrativo/a. Esta guía de Subalterno reúne la información y las fuentes oficiales de la escala.")
            ],
            "administrativo/preguntas-resueltas/index.html":[
              ("<h2>Por qué publicamos una muestra</h2><p>Esta página muestra los casos ya documentados públicamente y deja visible el nivel de evidencia. Esta primera versión identifica el núcleo de cada pregunta sin reconstruir enunciados u opciones que no tengamos aquí en forma canónica publicable.</p>",
               "<h2>Qué muestran estas 20 respuestas</h2><p>La selección reúne casos documentados con distintos niveles de revisión y deja visible la fuente utilizada en cada uno.</p>")
            ],
            "administrativo/preguntas-dudosas/index.html":[
              ("No publicamos aquí una tabla de 500 letras porque esta URL está pensada para resolver dudas concretas, no para sustituir la práctica.",
               "Aquí reunimos las preguntas que requieren una explicación adicional, una corrección o una salvedad."),
              ("Publicamos seis ejemplos para mostrar qué significa esta categoría sin convertir la página en una clave completa de 500 letras.",
               "Estos seis ejemplos muestran respuestas confirmadas tras una revisión individual."),
              ("La finalidad de esta página es hacer visible dónde una letra necesita explicación y cómo se corrige cuando una fuente más sólida obliga a cambiarla. No pretendemos sustituir la práctica de la batería por una lista de respuestas. La app de Administrativo/a ya está disponible en Google Play y es la capa de repetición, seguimiento de fallos y práctica de las 500 preguntas.",
               "Cuando una fuente más sólida obliga a cambiar una respuesta, documentamos el cambio y mantenemos visible el nivel de evidencia. Para practicar la batería completa, repetir fallos y seguir el progreso, la app de Administrativo/a está disponible en Google Play.")
            ],
            "administrativo/app-test-upv-ehu/index.html":[
              ("La captura actual de la app muestra un bloque inicial gratuito para probarla.",
               "Puedes probar 25 preguntas gratis antes de continuar con el acceso completo."),
              ("Capturas completas de la versión mostrada actualmente, sin recortarlas a un marco horizontal.",
               "Estas pantallas muestran el configurador, el test, el modo de práctica y las estadísticas de progreso."),
              ("El reproductor solo se carga cuando pulsas reproducir.",
               "Un recorrido breve por la experiencia real de práctica.")
            ]
          }

          for filename,reps in replacements.items():
              p=Path(filename)
              text=p.read_text(encoding="utf-8")
              for old,new in reps:
                  if old not in text:
                      raise SystemExit(f"No se encontró texto esperado en {filename}: {old}")
                  text=text.replace(old,new)
              p.write_text(text,encoding="utf-8")

          p=Path("administrativo/preguntas-resueltas/index.html")
          text=p.read_text(encoding="utf-8")
          remove='<div class="notice"><strong>Siguiente mejora:</strong> cuando el repositorio editorial disponga del enunciado y opciones canónicas de cada ítem en una salida publicable, esta página podrá ampliar la muestra sin inventar contenido.</div>'
          if remove not in text:
              raise SystemExit("No se encontró la nota Siguiente mejora")
          p.write_text(text.replace(remove,""),encoding="utf-8")

          recurrence=Path("administrativo/que-preguntas-se-repiten/index.html").read_text(encoding="utf-8")
          if "not permite" in recurrence:
              Path("administrativo/que-preguntas-se-repiten/index.html").write_text(
                recurrence.replace("not permite","no permite"),encoding="utf-8"
              )

          Path("README.md").write_text(
            "# EuskadiOposiciones · UPV/EHU 2026\n\n"
            "Sitio público de información y preparación de la OPE PTGAS UPV/EHU 2026.\n\n"
            "Web: https://euskadioposiciones.com/upvehuoposicionesbateria/\n\n"
            "Proyecto independiente. Las publicaciones oficiales de la UPV/EHU y del BOPV prevalecen siempre.\n",
            encoding="utf-8"
          )

          sitemap=Path("sitemap.xml").read_text(encoding="utf-8")
          for loc in [
            "https://euskadioposiciones.com/upvehuoposicionesbateria/",
            "https://euskadioposiciones.com/upvehuoposicionesbateria/administrativo/preguntas-dudosas/",
            "https://euskadioposiciones.com/upvehuoposicionesbateria/subalterno/bateria-400-preguntas/"
          ]:
              pattern=re.compile(r"(<url><loc>"+re.escape(loc)+r"</loc><lastmod>)\d{4}-\d{2}-\d{2}(</lastmod>)")
              sitemap,n=pattern.subn(r"\g<1>2026-09-28\2",sitemap)
              if n != 1:
                  raise SystemExit(f"No se actualizó lastmod de {loc}: {n}")
          Path("sitemap.xml").write_text(sitemap,encoding="utf-8")

          Path("README_DEPLOY.md").unlink(missing_ok=True)
          Path("CHANGE.patch").unlink(missing_ok=True)
          Path(".github/workflows/cleanup-public.yml").unlink()

      - name: Verify
        shell: bash
        run: |
          ! grep -R "Siguiente mejora:" -n administrativo/preguntas-resueltas/index.html
          ! grep -R "para no mezclar intenciones" -n bateria-500-preguntas-administrativo-ehu/index.html
          ! grep -R "no hemos cerrado un análisis propio equivalente" -n subalterno/bateria-400-preguntas/index.html
          ! grep -R "No publicamos aquí una tabla de 500 letras" -n administrativo/preguntas-dudosas/index.html
          ! grep -R "La captura actual de la app" -n administrativo/app-test-upv-ehu/index.html
          test ! -e README_DEPLOY.md
          test ! -e CHANGE.patch

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean public copy and remove internal strategy notes"
          git push origin main
